<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#860000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a30000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#860000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bannerGrad)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="150" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="1100" cy="150" r="80" fill="#ffffff" opacity="0.05"/>

  <!-- Main text -->
  <text x="600" y="130" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">FOKUS SANAL ASİSTANLAR</text>
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="24" fill="#ffc107" text-anchor="middle">9 Farklı Yapay Zeka Destekli Asistan</text>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.9" text-anchor="middle">İş Süreçlerinizi Otomatikleştirin • 7/24 Aktif • Düşük Maliyet</text>
</svg>
