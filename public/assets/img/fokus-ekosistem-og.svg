<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#860000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a30000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogGrad)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="315" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="1000" cy="315" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="600" cy="100" r="80" fill="#ffffff" opacity="0.03"/>
  <circle cx="600" cy="530" r="80" fill="#ffffff" opacity="0.03"/>

  <!-- Main logo/icon -->
  <circle cx="600" cy="240" r="60" fill="#ffc107"/>
  <text x="600" y="265" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#860000" text-anchor="middle">F</text>

  <!-- Main text -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">FOKUS EKOSİSTEMİ</text>
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="32" fill="#ffc107" text-anchor="middle">9 Yapay Zeka Destekli Sanal Asistan</text>
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" opacity="0.9" text-anchor="middle">Veri Bilimi • İş Süreçleri Otomasyonu • YZ Danışmanlığı</text>

  <!-- Bottom tagline -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" opacity="0.7" text-anchor="middle">fokusistatistik.com</text>
</svg>
