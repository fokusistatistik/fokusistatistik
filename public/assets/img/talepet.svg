  <line x1="70" y1="85" x2="130" y2="85" stroke="#860000" stroke-width="3" opacity="0.7"/>
  <line x1="70" y1="105" x2="130" y2="105" stroke="#860000" stroke-width="3" opacity="0.7"/>
  <line x1="70" y1="125" x2="110" y2="125" stroke="#860000" stroke-width="3" opacity="0.7"/>

  <!-- Text label -->
