<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background -->
  <defs>
    <linearGradient id="talepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#860000;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#860000;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#talepGrad)" rx="10"/>

  <!-- Document icon -->
